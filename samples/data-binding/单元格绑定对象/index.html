<!doctype html>
<html>

<head>
    <title>SpreadJS in TypeScript</title>
    <link rel="stylesheet" type="text/css" href="node_modules/@grapecity-software/spread-sheets/styles/gc.spread.sheets.excel2013white.css">
     <link rel="stylesheet" type="text/css" href="node_modules/@grapecity-software/spread-sheets-designer/styles/gc.spread.sheets.designer.min.css">
    <script src="node_modules/systemjs/dist/system.src.js"></script>
    <script src="systemjs.config.js"></script>
    <script>
        System.import('./src/app');
    </script>
    <style>
        .popup {
            display: none;
        }

        .content {
            position: fixed;
            top: 100px;
            left: 300px;
            z-index: 100;
            width: 230px;
            padding: 10px;
            border: 1px solid darkgrey;
            background-color: mediumspringgreen
        }

        .modal {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 99;
        }

        .pair {
            display: flex;
            margin-top: 10px;
            justify-content: space-between;
            align-items: center;
        }

        .buttongroup {
            display: flex;
            margin-top: 10px;
            justify-content: center;
            align-items: center;
        }

        .cancel {
            margin-right: 20px;
        }

        .btn {
            border: none;
            width: 40px;
            border-radius: 4px;
            height: 20px;
        }

        .save {
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>
    <div class="popup">
        <div class="modal"></div>
        <div class="content">
            <div class="pair">
                <span>姓名</span>
                <input type="text" id="name" />
            </div>
            <div class="pair">
                <span>性别</span>
                <input type="text" id="gender" />
            </div>
            <div class="pair">
                <span>年龄</span>
                <input type="number" id="age" />
            </div>
            <div class="buttongroup">
                <button class="btn cancel">取消</button>
                <button class="btn save">确定</button>
            </div>
        </div>
    </div>
    <div id="ss" style="width:100%;height:98vh;border:1px solid darkgray"></div>
</body>

</html>
