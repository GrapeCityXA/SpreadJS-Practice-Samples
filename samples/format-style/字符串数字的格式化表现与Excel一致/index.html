<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpreadJS Designer in Javascript</title>
	<link rel="stylesheet" type="text/css" href="node_modules/@grapecity-software/spread-sheets/styles/gc.spread.sheets.excel2013white.css">
    <link rel="stylesheet" type="text/css" href="node_modules/@grapecity-software/spread-sheets-designer/styles/gc.spread.sheets.designer.min.css">
    <script src="node_modules/systemjs/dist/system.src.js"></script>
    <script src="systemjs.config.js"></script>
    <script>
        System.import('./src/app.js');
    </script>
    <style>
        body {
            padding: 0;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        #designer-container {
            height: 80%;
            width: 100%;
        }
    </style>
</head>
<body>
    <p>请注意B2单元格的值，它是一个字符串类型，并且被设置了0.00的formatter，此时的表现和Excel一致。您可以将app.js中的核心代码注释掉，再查看区别。</p>
    <div id="designer-container"></div>
</body>
</html>
