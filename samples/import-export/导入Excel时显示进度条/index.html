<!doctype html>
<html>

<head>
    <title>SpreadJS in TypeScript</title>
    <link rel="stylesheet" type="text/css"
        href="node_modules/@grapecity-software/spread-sheets/styles/gc.spread.sheets.excel2013white.css">
    <script src="node_modules/systemjs/dist/system.src.js"></script>
    <script src="systemjs.config.js"></script>
    <script src="https://unpkg.com/js-circle-progress/dist/circle-progress.min.js" type="module"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
        }

        #progress {
            display: none;
            position: fixed;
            z-index: 101;
            left: 50%;
            top: 50%;
        }

        circle-progress::part(value) {
            stroke-width: 6px;
            stroke: hsl(39, 100%, 50%);
        }

        circle-progress::part(circle) {
            stroke-width: 6px;
            stroke: hsl(39, 100%, 85%);
        }

        circle-progress::part(text) {
            fill: hsl(39, 100%, 50%);
        }
    </style>
</head>

<body>
    <button id="excel">导入Excel</button>
    <div class="modal"></div>
    <circle-progress id="progress" value="0" max="100"></circle-progress>
    <div id="ss" style="width:100%;height:90vh;border:1px solid darkgray"></div>
    <script>
        System.import('./src/app');
    </script>
</body>

</html>
